<div class="table-scroll">
  <table mat-table class="insights" [dataSource]="groups()">
    <ng-container matColumnDef="label">
      <th mat-header-cell *matHeaderCellDef>Group</th>
      <td mat-cell *matCellDef="let group">{{ group.label }}</td>
    </ng-container>
    <ng-container matColumnDef="currency">
      <th mat-header-cell *matHeaderCellDef>Currency</th>
      <td mat-cell *matCellDef="let group">{{ group.currency }}</td>
    </ng-container>
    <ng-container matColumnDef="headcount">
      <th mat-header-cell *matHeaderCellDef class="number">Headcount</th>
      <td mat-cell *matCellDef="let group" class="number">{{ group.headcount | number }}</td>
    </ng-container>
    <ng-container matColumnDef="total">
      <th mat-header-cell *matHeaderCellDef class="number">Total</th>
      <td mat-cell *matCellDef="let group" class="number">{{ money(group.total, group) }}</td>
    </ng-container>
    <ng-container matColumnDef="min">
      <th mat-header-cell *matHeaderCellDef class="number">Min</th>
      <td mat-cell *matCellDef="let group" class="number">{{ money(group.min, group) }}</td>
    </ng-container>
    <ng-container matColumnDef="median">
      <th mat-header-cell *matHeaderCellDef class="number">Median</th>
      <td mat-cell *matCellDef="let group" class="number">{{ money(group.median, group) }}</td>
    </ng-container>
    <ng-container matColumnDef="mean">
      <th mat-header-cell *matHeaderCellDef class="number">Mean</th>
      <td mat-cell *matCellDef="let group" class="number">{{ money(group.mean, group) }}</td>
    </ng-container>
    <ng-container matColumnDef="max">
      <th mat-header-cell *matHeaderCellDef class="number">Max</th>
      <td mat-cell *matCellDef="let group" class="number">{{ money(group.max, group) }}</td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="columns"></tr>
    <tr mat-row *matRowDef="let row; columns: columns"></tr>
  </table>
</div>

<!-- The labels and messages are hard-coded in English for now. For localization they should come from one central place, such as Angular's i18n. -->
<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" data-test="cancel-delete" (click)="answer(false)">Cancel</button>
  <button mat-flat-button type="button" data-test="confirm-delete" (click)="answer(true)">
    Delete
  </button>
</mat-dialog-actions>

spring.application.name=peoplemanagement
management.endpoint.health.show-details=never

# Liquibase owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# The datasource comes from SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.

# A fraction where a whole number is expected is an error, never silently cut off. Without this,
# "amountMinor": 100.9 would be stored as 100. The backend never rounds money.
spring.jackson.deserialization.accept-float-as-int=false
